# Reverse proxy Nginx pour l'API Bondiz.
# À placer dans /etc/nginx/sites-available/ puis à lier dans sites-enabled/.
# Les directives SSL sont ajoutées automatiquement par certbot.

server {
    listen 80;
    server_name api.example.com;   # à remplacer par ton domaine

    # certbot remplacera ce bloc par une redirection vers HTTPS.
    location / {
        proxy_pass http://127.0.0.1:1337;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nécessaire si tu ajoutes un jour du temps réel (WebSocket).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
    }

    # Taille maximale d'un envoi de fichier (doit rester cohérente
    # avec UPLOAD_SIZE_LIMIT côté Strapi).
    client_max_body_size 12M;
}
