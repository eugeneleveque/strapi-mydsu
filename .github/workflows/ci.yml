name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests et couverture
    runs-on: ubuntu-latest

    env:
      # Secrets factices : les tests tournent sur une base SQLite jetable.
      NODE_ENV: test
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/ci.db
      APP_KEYS: testKeyA,testKeyB
      API_TOKEN_SALT: testApiTokenSalt
      ADMIN_JWT_SECRET: testAdminJwtSecret
      TRANSFER_TOKEN_SALT: testTransferTokenSalt
      ENCRYPTION_KEY: testEncryptionKeyForCiOnly
      JWT_SECRET: testJwtSecret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Compilation TypeScript
        run: npx tsc -p tsconfig.json

      - name: Tests d'intégration et couverture
        run: npm run test:coverage

      - name: Publication du rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: test
    # Les pull requests vérifient seulement que l'image se construit ;
    # seule la branche main publie sur le registre.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GitHub (GHCR)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
